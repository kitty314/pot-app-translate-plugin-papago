name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid tag: $TAG_NAME. Expected vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Read plugin metadata
        id: metadata
        run: |
          plugin_id="$(jq -er '.id | select(type == "string" and length > 0)' info.json)"
          icon="$(jq -er '.icon | select(type == "string" and length > 0)' info.json)"
          test -f "$icon"
          echo "archive=${plugin_id}.potext" >> "$GITHUB_OUTPUT"
          echo "icon=$icon" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          ICON: ${{ steps.metadata.outputs.icon }}
        run: zip -9 "$ARCHIVE" info.json "$ICON" main.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.archive }}
          path: ${{ steps.metadata.outputs.archive }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.metadata.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
